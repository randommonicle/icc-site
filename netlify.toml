[build]
  # Phase 1 cutover (D-001/D-013): build the Astro public site and publish it.
  # admin.html stays canonical at the repo root and is copied into the publish
  # dir at build time, so there is no second copy to drift. Functions unchanged.
  command = "npm install --prefix site && npm run build --prefix site && cp admin.html site/dist/admin.html"
  publish = "site/dist"
  functions = "server/netlify/functions"

# Pin Node 24 for the build AND the Functions runtime (AWS Lambda nodejs24.x).
# Node 20 reached end-of-life on 30 Apr 2026; Node 24 is LTS until Apr 2028.
# This NODE_VERSION takes precedence over .nvmrc and package.json "engines".
[build.environment]
  NODE_VERSION = "24"

# Scheduled retention purge (A5 / D-023, UK GDPR Art.5(1)(e)): once a day, delete
# handoff-lead rows older than the retention period in shared/config/retention.js
# (the "no longer than 6 months" the privacy notice promises). The function is
# kind-guarded and only removes already-expired rows (see purge-handoffs.js).
[functions."purge-handoffs"]
  schedule = "@daily"

# Keep the free-tier Supabase project awake pre-launch: one cheap daily read so it
# does not auto-pause for inactivity (read-only, no PII — see supabase-keepalive.js).
[functions."supabase-keepalive"]
  schedule = "@daily"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/handoffs"
  to = "/.netlify/functions/handoffs"
  status = 200

# D-025 — one-click "mark job complete & request a Google review" (email + SMS).
# Admin-gated (requireAdmin); dormant until GOOGLE_REVIEW_URL + the SMS gateway
# key are set in Netlify.
[[redirects]]
  from = "/api/review-request"
  to = "/.netlify/functions/reviewRequest"
  status = 200

# D-027 — provisional-booking accept/decline. Mark actions a late-finish booking
# from the one-click link in his notification email; the link opens the read-only
# /booking-action page, which POSTs {job, token, action} here. Token-authorised
# (single-use SHA-256), POST-only (a mutating GET would be scanner-prefetched).
[[redirects]]
  from = "/api/booking-action"
  to = "/.netlify/functions/bookingAction"
  status = 200

# D-027 Phase 5 — admin fallback for a provisional booking (accept/decline/resend/retry),
# for when Mark's one-click email link is lost. Admin-gated (requireAdmin); no token.
[[redirects]]
  from = "/api/booking-admin"
  to = "/.netlify/functions/bookingAdmin"
  status = 200

# Phase 2, Slice 3 — versioned API (/api/v1/*). Stateless server-side quote;
# runs alongside the live /api/chat flow (D-003/D-011/D-012).
[[redirects]]
  from = "/api/v1/quote"
  to = "/.netlify/functions/v1-quote"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Baseline security headers on every response. CSP is intentionally omitted
# until the inline event handlers in index.html/admin.html are refactored —
# adding it now would break the site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Admin dashboard: no caching (keep bookings fresh) and no indexing
[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# PRE-LAUNCH ONLY — DELETE THIS BLOCK AT THE DOMAIN CUTOVER (D-013)
# ---------------------------------------------------------------------------
# The site is served from super-frangollo-c3a14a.netlify.app and is not yet on
# intelligentclean.co.uk. Left crawlable, the temporary host is what enters the
# index first, and three things make that actively unhelpful:
#
#   1. Every page's canonical, og:url and sitemap entry already points at
#      www.intelligentclean.co.uk, which today serves a 123 Reg parking page with
#      third-party ads. The canonical cannot be honoured, so the signal is wasted
#      at exactly the moment the brand's first crawl impressions form.
#   2. (Resolved 1 Sep 2026: the ICO registration number ZC230232 is now in
#      privacy.astro.) A human data-protection review of the notice is still
#      outstanding, so it should still not be the first version Google indexes.
#   3. Anything indexed under the netlify.app name has to be cleaned up after the
#      cutover rather than simply starting on the real domain.
#
# TODO(prelaunch/noindex): remove this block when DNS points at Netlify and the
# custom domain is primary. Leaving it in place after cutover would keep the real
# site out of the index entirely, so it is the first thing to check if the site
# does not appear in Search Console.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
